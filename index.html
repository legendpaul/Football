<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Tournament Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <button id="u21euro">U21 European Cup</button>
        <button id="clubworldcup">Club World Cup</button>
    </nav>

    <main>
        <section id="tournament-details">
            <h1 id="tournament-name"></h1>
            <div id="fixtures">
                <h2>Upcoming Fixtures</h2>
                <!-- Fixtures will be loaded here -->
            </div>
            <div id="tournament-tree">
                <h2>Tournament Tree</h2>
                <div id="group-stage">
                    <h3>Group Stage</h3>
                    <!-- Group stage tables will be loaded here -->
                </div>
                <div id="knockout-stage">
                    <h3>Knockout Stage</h3>
                    <!-- Knockout stage tree will be loaded here -->
                </div>
            </div>
            <div id="results">
                <h2>Results</h2>
                <!-- Results will be loaded here -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
