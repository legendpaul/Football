<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Football Tracker - Live Scores & Fixtures</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b5e20">
  <meta name="description" content="Live football scores, fixtures and results across all leagues worldwide.">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { margin:0; padding:0; background:#191919; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow-x:hidden; }
    .loading-screen { position:fixed; inset:0; background:linear-gradient(135deg,#1b5e20,#191919); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; transition:opacity .5s,visibility .5s; }
    .loading-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .loading-logo  { font-size:48px; font-weight:700; margin-bottom:20px; }
    .loading-spinner { width:40px; height:40px; border:3px solid rgba(255,255,255,.3); border-top:3px solid #fff; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:20px; }
    .loading-text  { font-size:16px; opacity:.8; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Layout */
    .app-container  { max-width:900px; margin:0 auto; padding:0 12px 40px; }
    .header         { padding:16px 0 8px; }
    .header-content { display:flex; align-items:center; justify-content:space-between; }
    .main-title     { margin:0; font-size:22px; font-weight:700; color:#69f0ae; }
    .time-display   { display:flex; align-items:center; gap:6px; font-size:13px; color:rgba(255,255,255,.6); }
    .section        { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:14px; margin-bottom:12px; }
    .section-header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .section-title  { margin:0; font-size:15px; font-weight:700; }

    /* League selector */
    .league-top-bar     { display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .league-select-wrap { display:flex; flex-direction:column; gap:4px; flex:1; min-width:200px; }
    .l-label            { font-size:11px; font-weight:600; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.5px; }
    .league-dropdown    { background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:8px 12px; font-size:14px; cursor:pointer; width:100%; max-width:420px; }
    .league-dropdown optgroup { color:#aaa; font-size:11px; }
    .league-dropdown option   { color:#fff; background:#1a1a2e; }
    .league-badge       { display:flex; gap:6px; align-items:center; margin-top:4px; flex-wrap:wrap; }
    .cat-pill           { font-size:11px; font-weight:700; color:#fff; padding:3px 10px; border-radius:20px; }
    .country-label      { font-size:11px; color:rgba(255,255,255,.5); }
    .fetch-btn          { background:linear-gradient(135deg,#1b5e20,#43a047); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-weight:700; cursor:pointer; height:38px; align-self:flex-end; white-space:nowrap; }
    .fetch-btn:disabled { opacity:.5; }

    /* View toggle */
    .view-toggle { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .view-btn    { background:rgba(255,255,255,.08); color:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.15); padding:7px 14px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer; position:relative; }
    .view-btn.active, .view-btn:hover { background:#1b5e20; color:#fff; border-color:#1b5e20; }
    .count-badge { position:absolute; top:-5px; right:-5px; background:#e53935; color:#fff; font-size:10px; font-weight:700; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

    /* Status bar */
    .status-bar { font-size:12px; color:rgba(255,255,255,.5); display:flex; gap:12px; flex-wrap:wrap; }

    /* Views */
    .view-container { min-height:60px; }
    .main-section   { padding:14px; }

    /* League & Date grouping */
    .league-group { margin-bottom:18px; }
    .league-header { font-size:12px; font-weight:700; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.8px; padding:6px 0 8px; border-bottom:1px solid rgba(255,255,255,.07); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
    .date-header  { font-size:12px; font-weight:700; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.8px; padding:6px 0 8px; border-bottom:1px solid rgba(255,255,255,.07); margin-bottom:8px; }
    .date-group   { margin-bottom:20px; }
    .bracket-count { background:rgba(255,255,255,.1); padding:1px 7px; border-radius:10px; font-size:11px; }

    /* Match cards */
    .match-card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:10px 12px; margin-bottom:8px; transition:transform .15s; }
    .match-card:hover { transform:translateY(-1px); }
    .match-card.live    { border-left:3px solid #e53935; }
    .match-card.fixture { border-left:3px solid #1565c0; }
    .match-card.result  { border-left:3px solid #2e7d32; }
    .match-card.fav-match { background:rgba(255,200,0,.07); }

    .match-card-header { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:8px; font-size:11px; }
    .league-badge { background:rgba(255,255,255,.08); color:rgba(255,255,255,.6); padding:2px 8px; border-radius:10px; font-size:11px; }
    .stage-badge  { background:rgba(255,255,255,.05); color:rgba(255,255,255,.4); padding:2px 8px; border-radius:10px; font-size:10px; }
    .fav-star     { font-size:13px; margin-left:auto; }

    /* Status badges */
    .status-badge         { padding:2px 10px; border-radius:12px; font-size:11px; font-weight:600; margin-left:auto; }
    .status-badge.live    { background:rgba(229,57,53,.2); color:#ef9a9a; display:flex; align-items:center; gap:5px; }
    .status-badge.upcoming{ background:rgba(21,101,192,.2); color:#90caf9; }
    .status-badge.finished{ background:rgba(46,125,50,.2); color:#a5d6a7; }
    .minute-badge         { font-weight:700; }

    /* Match body */
    .match-body   { display:flex; align-items:center; gap:8px; }
    .team-col     { flex:1; display:flex; align-items:center; gap:6px; }
    .home-col     { justify-content:flex-end; text-align:right; }
    .away-col     { justify-content:flex-start; text-align:left; }
    .team-name    { font-size:14px; font-weight:500; }
    .winner-name  { font-weight:700; color:#69f0ae; }
    .team-logo    { width:22px; height:22px; object-fit:contain; }

    /* Score */
    .score-block  { display:flex; align-items:center; gap:6px; min-width:70px; justify-content:center; flex-shrink:0; }
    .score-home, .score-away { font-size:20px; font-weight:700; min-width:22px; text-align:center; }
    .score-dash   { font-size:14px; color:rgba(255,255,255,.3); }
    .vs-block     { min-width:50px; }
    .vs-text      { font-size:16px; font-weight:700; color:rgba(255,255,255,.25); }
    .ht-score     { font-size:10px; color:rgba(255,255,255,.35); text-align:center; margin-top:2px; }

    /* Live dot */
    .live-header { display:flex; align-items:center; justify-content:space-between; padding:6px 0 10px; font-size:12px; color:rgba(255,255,255,.6); }
    .live-dot-label { display:flex; align-items:center; gap:6px; font-weight:700; color:#ef9a9a; }
    .live-dot       { width:8px; height:8px; background:#e53935; border-radius:50%; animation:pulse 1.2s infinite; }
    .live-dot.small { width:6px; height:6px; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.3)} }
    .refresh-hint { font-size:11px; }

    /* Empty / error */
    .empty-state,.error-state { text-align:center; padding:40px 16px; color:rgba(255,255,255,.4); }
    .empty-icon,.error-icon   { font-size:36px; margin-bottom:12px; }
    .empty-title,.error-msg   { font-size:15px; font-weight:600; margin-bottom:6px; }
    .empty-sub  { font-size:13px; }
    .retry-btn  { margin-top:12px; background:#1b5e20; color:#fff; border:none; padding:8px 20px; border-radius:8px; cursor:pointer; font-weight:600; }

    /* Team tags */
    .team-tag    { display:inline-flex; align-items:center; gap:4px; background:rgba(255,200,0,.15); border:1px solid rgba(255,200,0,.3); color:#ffd740; padding:4px 10px; border-radius:20px; font-size:13px; margin:3px; }
    .tag-remove  { background:none; border:none; color:#ffd740; cursor:pointer; font-size:14px; line-height:1; padding:0 2px; }
    .no-teams-hint { font-size:13px; color:rgba(255,255,255,.4); }

    /* Team controls */
    .team-input-container { display:flex; gap:8px; margin-bottom:10px; }
    .team-input  { flex:1; background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:8px 12px; font-size:14px; }
    .add-team-btn { background:#1b5e20; color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:600; cursor:pointer; white-space:nowrap; }
    .clear-teams-btn { background:rgba(255,255,255,.08); color:rgba(255,255,255,.6); border:none; padding:4px 10px; border-radius:8px; cursor:pointer; font-size:12px; }
    .team-list-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:12px; color:rgba(255,255,255,.5); }

    /* Footer */
    .footer { text-align:center; padding:20px 0 10px; font-size:12px; color:rgba(255,255,255,.3); }

    .view-btn.wc-btn { background:linear-gradient(135deg,#1a237e,#4a148c); color:#fff; border-color:#1a237e; }
    .view-btn.wc-btn.active, .view-btn.wc-btn:hover { background:linear-gradient(135deg,#283593,#6a1b9a); border-color:#283593; }

    /* World Cup styles */
    .wc-hero { background:linear-gradient(135deg,#1a237e,#4a148c); border-radius:12px; padding:20px; margin-bottom:16px; text-align:center; }
    .wc-trophy { font-size:48px; margin-bottom:8px; }
    .wc-title  { font-size:20px; font-weight:700; margin-bottom:4px; }
    .wc-sub    { font-size:13px; color:rgba(255,255,255,.7); margin-bottom:12px; }
    .wc-countdown { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .wc-stat   { background:rgba(255,255,255,.15); padding:8px 16px; border-radius:8px; text-align:center; }
    .wc-stat-num { font-size:22px; font-weight:700; display:block; }
    .wc-stat-label { font-size:10px; color:rgba(255,255,255,.6); text-transform:uppercase; }

    .wc-group-filter { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
    .wc-group-btn { background:rgba(255,255,255,.08); color:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.15); padding:5px 12px; border-radius:16px; font-size:12px; font-weight:600; cursor:pointer; }
    .wc-group-btn.active { background:#1a237e; color:#fff; border-color:#1a237e; }

    .wc-match { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:10px 12px; margin-bottom:6px; }
    .wc-match-header { font-size:11px; color:rgba(255,255,255,.4); margin-bottom:6px; display:flex; gap:8px; align-items:center; }
    .wc-group-badge { background:rgba(26,35,126,.5); color:#90caf9; padding:1px 8px; border-radius:10px; font-weight:700; }
    .wc-teams { display:flex; align-items:center; gap:8px; }
    .wc-team  { flex:1; font-size:14px; font-weight:500; }
    .wc-team.right { text-align:right; }
    .wc-vs    { font-size:12px; color:rgba(255,255,255,.3); min-width:30px; text-align:center; }
    .wc-time  { font-size:13px; font-weight:700; color:#90caf9; min-width:40px; text-align:center; }
    .wc-groups-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-bottom:16px; }
    .wc-group-card { background:rgba(26,35,126,.2); border:1px solid rgba(26,35,126,.4); border-radius:10px; padding:10px; }
    .wc-group-title { font-size:12px; font-weight:700; color:#90caf9; margin-bottom:6px; }
    .wc-group-team  { font-size:13px; padding:3px 0; border-bottom:1px solid rgba(255,255,255,.05); }
    .wc-group-team:last-child { border-bottom:none; }
    .wc-team-fav { color:#ffd740; }

    /* Match meta (venue/attendance) */
    .match-meta { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; font-size:11px; color:rgba(255,255,255,.4); }

    /* Tournament structure */
    .tourn-info-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; background:rgba(27,94,32,.3); border-radius:8px; padding:10px 14px; margin-bottom:14px; }
    .tourn-title { font-weight:700; font-size:15px; }
    .tourn-meta  { font-size:12px; color:rgba(255,255,255,.6); }
    .groups-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; margin-bottom:16px; }
    .group-table-card { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:10px; }
    .group-title { font-size:13px; font-weight:700; color:#69f0ae; margin-bottom:8px; }
    .table-wrap  { overflow-x:auto; }
    .standings-table { width:100%; border-collapse:collapse; font-size:12px; }
    .standings-table th { color:rgba(255,255,255,.4); font-weight:600; padding:4px 6px; text-align:center; border-bottom:1px solid rgba(255,255,255,.08); }
    .standings-table td { padding:4px 6px; text-align:center; border-bottom:1px solid rgba(255,255,255,.04); }
    .standings-table .team-cell { text-align:left; white-space:nowrap; }
    .standings-table .rank-cell { color:rgba(255,255,255,.4); }
    .standings-table tr.qualifying td { background:rgba(105,240,174,.07); }
    /* Knockout bracket */
    .ko-section-title { font-size:14px; font-weight:700; color:#69f0ae; margin:16px 0 10px; }
    .ko-bracket { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
    .ko-round   { min-width:190px; flex:1; }
    .ko-round-title { font-size:11px; font-weight:700; color:rgba(255,255,255,.4); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
    .ko-match   { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:8px 10px; margin-bottom:8px; }
    .ko-label   { font-size:10px; font-weight:700; color:#ffd740; margin-bottom:4px; text-transform:uppercase; }
    .ko-team    { display:flex; align-items:center; justify-content:space-between; padding:3px 0; font-size:13px; }
    .ko-team.winner { font-weight:700; color:#69f0ae; }
    .ko-score   { font-weight:700; min-width:20px; text-align:right; }
    .ko-venue   { font-size:10px; color:rgba(255,255,255,.35); margin-top:4px; }
    .ko-date    { font-size:10px; color:rgba(255,255,255,.3); margin-top:2px; }
    /* Debug panel */
    .debug-tabs  { display:flex; gap:6px; margin-bottom:12px; }
    .debug-tab   { background:rgba(255,255,255,.08); color:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.15); padding:6px 14px; border-radius:16px; font-size:12px; cursor:pointer; }
    .debug-tab.active { background:#1b5e20; color:#fff; border-color:#1b5e20; }
    .debug-panel { display:none; }
    .debug-panel.active { display:block; }
    .debug-table { width:100%; border-collapse:collapse; font-size:13px; }
    .debug-table td { padding:6px 8px; border-bottom:1px solid rgba(255,255,255,.06); }
    .debug-table td:first-child { color:rgba(255,255,255,.5); width:140px; }

    @media (max-width:520px) {
      .match-body { flex-direction:column; gap:4px; }
      .team-col   { justify-content:center !important; text-align:center !important; }
      .score-block { min-width:auto; }
      .league-top-bar { flex-direction:column; align-items:stretch; }
      .fetch-btn { align-self:auto; }
    }
  </style>
</head>
<body>

  <div class="loading-screen" id="loading-screen">
    <div class="loading-logo">⚽ Football Tracker</div>
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading live match data…</div>
  </div>

  <div class="app-container">

    <!-- Header -->
    <div class="header">
      <div class="header-content">
        <h1 class="main-title">⚽ Football Tracker</h1>
        <div class="time-display">
          🕐 <span id="current-time">--:--</span> BST
        </div>
      </div>
    </div>

    <!-- League Selector + Nav -->
    <div class="section">
      <div class="league-top-bar">
        <div class="league-select-wrap">
          <label for="league-select" class="l-label">🏆 League</label>
          <select id="league-select" class="league-dropdown">
            <option value="">Loading leagues…</option>
          </select>
          <div id="league-badge" class="league-badge"></div>
        </div>
        <button id="fetch-btn" class="fetch-btn">🔄 Refresh</button>
      </div>

      <div class="view-toggle">
        <button class="view-btn active" data-view="live">🔴 Live</button>
        <button class="view-btn" data-view="fixtures">📅 Fixtures</button>
        <button class="view-btn" data-view="results">📊 Results</button>
        <button class="view-btn" data-view="teams">⭐ My Teams</button>
        <button class="view-btn" data-view="tournament">📊 Structure</button>
        <button class="view-btn wc-btn" data-view="worldcup">🏆 World Cup 2026</button>
        <button class="view-btn" data-view="debug" style="opacity:.6;font-size:11px">🔧</button>
      </div>

      <div class="status-bar">
        <span id="results-count">—</span>
        <span id="last-updated"></span>
      </div>
    </div>

    <!-- Main Views -->
    <div class="section main-section">
      <div class="section-header">
        <h2 class="section-title" id="main-section-title">Loading…</h2>
      </div>
      <div id="view-live"     class="view-container"></div>
      <div id="view-fixtures" class="view-container" style="display:none"></div>
      <div id="view-results"  class="view-container" style="display:none"></div>
      <div id="view-teams"    class="view-container" style="display:none"></div>
      <div id="view-worldcup"   class="view-container" style="display:none"></div>
      <div id="view-tournament" class="view-container" style="display:none"></div>
      <div id="view-debug"      class="view-container" style="display:none"></div>
    </div>

    <!-- Favourite Teams -->
    <div class="section">
      <div class="section-header">
        <div class="section-icon">⭐</div>
        <h2 class="section-title">Favourite Teams</h2>
      </div>
      <div class="team-input-container">
        <input type="text" id="team-input" class="team-input" placeholder="Type team name and press Enter…">
        <button id="add-team-btn" class="add-team-btn">⭐ Add</button>
      </div>
      <div class="team-list-header">
        <span>Your favourites:</span>
        <button id="clear-teams-btn" class="clear-teams-btn">🗑️ Clear All</button>
      </div>
      <div id="team-tags"></div>
    </div>

    <div class="footer">⚽ Football Tracker — AllSportsAPI live data</div>
  </div>

  <script src="app.js"></script>

</body>
</html>
