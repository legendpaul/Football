[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'Football Tracker - static site'"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "zisi"

[dev]
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"
